[project]
name = "rwa"
version = "1.0.0"
description = "Richmond Workers Assembly"
authors = [
    { name = "Alex Raymond", email = "harblz@gmail.com" },
]
license = "n"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django >= 5.1",
    "whitenoise >= 6.7",
    "django-taggit >= 6.0",
    "django-bootstrap5 >= 24.3",
    "django-htmx >= 1.19",
    "fontawesomefree >= 6.6.0",
    "django-ckeditor-5 >= 0.2.13",
    "django-cms >= 4.1.4",
    "djangocms-versioning >= 2.2.0",
    "djangocms-alias >= 2.0.2",
    "django-sekizai >= 4.1.0",
    "djangocms-text-ckeditor >= 5.1.6",
    "djangocms-admin-style >= 3.3.1",
    "djangocms-frontend[djangocms-icon,djangocms-link] (>=2.0.0a1)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
djangocms-frontend = { git = "https://github.com/django-cms/djangocms-frontend.git" }

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
setuptools = "*"
ipython = "^8.27"
django-extensions = "^3.2"
django-debug-toolbar = "^4.4"
werkzeug = "^3.0.4"
psycopg = {extras = ["binary"], version = "^3.2.3"}
pygraphviz = "^1.14"
black = {extras = ["d"], version = "^24.10.0"}


[tool.poetry.group.prod]
optional = true


[tool.poetry.group.prod.dependencies]
psycopg = {extras = ["c"], version = "^3.2.2"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
